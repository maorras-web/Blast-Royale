<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e1b18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Blast Royale</title>
    <link rel="icon" href="data:,">
    
    <!-- פונט Rubik מודרני -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=6">
    
    <!-- ספריית Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- שכבת הגבלה: המשחק מיועד לטלפונים בלבד ובמצב אנכי -->
    <div id="desktop-blocker" class="device-blocker">
        <div class="device-blocker-card">
            <div class="device-blocker-icon">📱</div>
            <h2>Mobile Only</h2>
            <p>המשחק מיועד לטלפונים במסך אנכי.</p>
            <small>פתח את המשחק בטלפון כדי לשחק.</small>
        </div>
    </div>

    <div id="landscape-blocker" class="device-blocker">
        <div class="device-blocker-card">
            <div class="device-blocker-icon">↕️</div>
            <h2>סובב את הטלפון</h2>
            <p>העבר את הטלפון למצב אנכי כדי לשחק.</p>
        </div>
    </div>

    <!-- UI עליון בזמן משחק -->
    <div id="ui-container">
        <div class="ui-card">
            <span class="ui-title">SCORE</span>
            <span id="score-val" class="ui-value">0</span>
        </div>

        <div class="ui-card">
            <span class="ui-title">COINS</span>
            <span id="coins-val" class="ui-value">0</span>
        </div>

        <div class="ui-card">
            <span class="ui-title">LEVEL</span>
            <span id="level-text" class="ui-value">1</span>
        </div>

        <div class="ui-card" id="hp-container">
            <div style="display: flex; justify-content: space-between; font-size: 10px; color: #a1a1aa;">
                <span>HP</span>
                <span id="hp-text">1000 / 1000</span>
            </div>
            <div class="hp-bar-bg">
                <div id="hp-bar"></div>
            </div>
        </div>
    </div>

    <!-- מסך פתיחה (Splash / Start) -->
    <div id="splash-screen" class="modal-overlay intro-only">
        <div class="modal-card splash-sheet">
            <h1 class="game-title">BLAST<br><span>ROYALE</span></h1>

            <!-- שורת נתונים קבועה: מטבעות ושיא -->
            <div class="splash-head">
                <div class="head-stat">
                    <span class="head-label">🪙 מטבעות</span>
                    <strong id="start-coins">0</strong>
                </div>
                <div class="head-stat">
                    <span class="head-label">🏆 שיא</span>
                    <strong id="start-best-score">0</strong>
                </div>
            </div>

            <!-- אזור הגלילה: תותח, שדרוגים, מפה -->
            <div class="splash-scroll">
                <section class="splash-section">
                    <div class="shop-section-title">תותח</div>
                    <div class="cannon-grid">
                        <button id="cannon-classic" class="map-card cannon-card owned selected" type="button">
                            <span class="map-icon">⚙️</span>
                            <span class="map-info"><strong>קלאסי</strong><small>מאוזן</small></span>
                            <span class="map-action">נבחר</span>
                        </button>
                        <button id="cannon-mk2" class="map-card cannon-card" type="button">
                            <span class="map-icon">🛡️</span>
                            <span class="map-info"><strong>NOVA</strong><small>4 קנים וליבה זוהרת</small></span>
                            <span class="map-action">250 C</span>
                        </button>
                    </div>
                </section>

                <section class="splash-section">
                    <div class="shop-section-title">שדרוגים</div>
                    <div class="upgrades-list">
                        <div class="upgrade-item">
                            <div>
                                <div class="upg-name">עוצמת ירייה</div>
                                <div id="power-lvl-text" class="upg-lvl">Lvl 1</div>
                            </div>
                            <button id="buy-power-btn" class="btn-upg">50 C</button>
                        </div>

                        <div class="upgrade-item">
                            <div>
                                <div class="upg-name">קצב אש</div>
                                <div id="rate-lvl-text" class="upg-lvl">Lvl 1</div>
                            </div>
                            <button id="buy-rate-btn" class="btn-upg">60 C</button>
                        </div>
                    </div>
                </section>

                <section class="splash-section">
                    <div class="shop-section-title">מפה</div>
                    <div class="maps-grid">
                        <button class="map-card selected owned" data-map-id="forest" type="button">
                            <span class="map-icon">🔺</span>
                            <span class="map-info"><strong>PYRAMIDS</strong><small>פרמידות</small></span>
                            <span class="map-action">נבחרה</span>
                        </button>
                        <button class="map-card owned" data-map-id="volcano" type="button">
                            <span class="map-icon">🌊</span>
                            <span class="map-info"><strong>SEA</strong><small>ים בלילה</small></span>
                            <span class="map-action">בחר</span>
                        </button>
                    </div>
                </section>
            </div>

            <button id="start-btn" class="btn-primary" type="button">התחל משחק</button>
        </div>
    </div>

    <!-- קובץ המשחק הראשי -->
    <script src="main.js?v=18"></script>
</body>
</html>
