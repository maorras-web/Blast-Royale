<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cannon Blast 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- טעינת Three.js לפני main.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-tap-text">לחץ להתחלת המשחק במסך מלא</div>
        </div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <div id="hp-container">
            <div id="hp-bar"></div>
            <span id="hp-text">1000 / 1000</span>
        </div>

        <div id="level-bar-container">
            <span id="level-text">LEVEL 1</span>
            <div class="progress-outer">
                <div id="level-progress-fill"></div>
            </div>
        </div>

        <div id="coin-card">
            🪙 <span id="coins-val">0</span>
        </div>

        <div id="score-card">
            <span class="score-label">SCORE</span>
            <span id="score-val">0</span>
        </div>

        <button id="pause-btn" class="icon-btn">⏸️</button>
    </div>

    <!-- Start & Shop Overlay -->
    <div id="start-overlay" class="hidden">
        <div id="start-menu">
            <h1 class="game-title">CANNON BLAST</h1>
            <p class="game-subtitle">השמד את הסלעים ושדרג את התותח</p>

            <div class="stats-row">
                <div class="best-badge">🏆 שיא: <span id="start-best-score">0</span></div>
                <div class="coins-badge">🪙 מטבעות: <span id="start-coins">0</span></div>
            </div>

            <div class="menu-tabs">
                <button class="tab-btn active">שדרוגים</button>
            </div>

            <div class="upgrade-item">
                <div class="upgrade-info">
                    <strong>עוצמת ירי</strong>
                    <span id="power-lvl-text">Lvl 1</span>
                </div>
                <button id="buy-power-btn" class="buy-btn">50 C</button>
            </div>

            <div class="upgrade-item">
                <div class="upgrade-info">
                    <strong>קצב ירי</strong>
                    <span id="rate-lvl-text">Lvl 1</span>
                </div>
                <button id="buy-rate-btn" class="buy-btn">60 C</button>
            </div>

            <div class="upgrade-item">
                <div class="upgrade-info">
                    <strong>מגנט מטבעות</strong>
                    <span id="magnet-lvl-text">Lvl 0</span>
                </div>
                <button id="buy-magnet-btn" class="buy-btn">100 C</button>
            </div>

            <button id="start-btn" class="btn btn-restart" style="margin-top: 15px;">התחל משחק</button>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="hidden">
        <div class="pause-card">
            <h2 class="game-title">משחק מושהה</h2>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="resume-btn" class="btn">המשך</button>
                <button id="home-btn" class="btn btn-secondary">תפריט ראשי</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden">
        <div class="pause-card">
            <h2 class="game-title" style="color: #ef4444;">GAME OVER</h2>
            <div style="margin: 15px 0; color: #fff;">
                <p>ניקוד: <strong id="final-score-val">0</strong></p>
                <p>מטבעות: <strong id="final-coins-val">0</strong></p>
                <p>שיא אישי: <strong id="best-score-val">0</strong></p>
            </div>
            <button id="restart-btn" class="btn btn-restart">שחק שוב</button>
        </div>
    </div>

    <!-- main.js נטען אחרי Three.js -->
    <script src="main.js"></script>
</body>
</html>
